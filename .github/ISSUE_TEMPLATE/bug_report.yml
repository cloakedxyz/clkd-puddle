name: Bug report
description: Report a reproducible, non-sensitive problem.
body:
  - type: markdown
    attributes:
      value: |
        For suspected security vulnerabilities, follow SECURITY.md instead.
        Never attach keys, seed phrases, wallet exports, recipient profiles,
        recovery files or credential-bearing RPC URLs.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproduction using disposable local test data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Source commit or package version, Node/npm/Foundry versions, OS and browser.
    validations:
      required: true
