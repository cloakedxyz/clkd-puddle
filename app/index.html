<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{{brand.name}} — fund your private wallet</title>
  <script src="/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10'/%3E%3Cpath d='M13 10h9a7 7 0 0 1 0 14h-4v6h-5Zm5 5v4h4a2 2 0 0 0 0-4Z' fill='white' fill-rule='evenodd'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/site.js"></script>
  {{app.scripts}}
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/" aria-label="{{brand.name}} home">{{brand.name}}</a>
      <details class="site-menu" id="site-menu">
        <summary id="menu-toggle" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h14M3 10h14M3 16h14"/></svg></summary>
        <nav aria-label="Resources">
          <a href="{{app.docs}}" target="_blank" rel="noreferrer">Docs<span aria-hidden="true">↗</span></a>
          <a href="{{app.recovery}}" target="_blank" rel="noreferrer">Recovery<span aria-hidden="true">↗</span></a>
          <div class="theme-row">
            <span id="menu-theme-label">Theme</span>
            <div class="theme-picker" role="group" aria-labelledby="menu-theme-label">
              <button data-theme-choice="light" type="button" aria-label="Light mode" aria-pressed="true" title="Light mode"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
              <button data-theme-choice="dark" type="button" aria-label="Dark mode" aria-pressed="false" title="Dark mode"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.9 13.1A8.7 8.7 0 0 1 10.9 3a9 9 0 1 0 10 10.1Z"/></svg></button>
            </div>
          </div>
        </nav>
      </details>
    </header>
    <main aria-label="{{app.label}}">
      <section id="intro" class="intro">
        <h1>Send normally.<br>Receive <em>privately.</em></h1>
        <p class="description">
          <span class="protocol-line"><span>Send to your private balance in</span>
            <a class="protocol-link" href="https://railgun.org/" target="_blank" rel="noreferrer" aria-label="RAILGUN"><span class="railgun-logo" aria-hidden="true"></span></a>
          </span>
          <span class="logo-phrase">from your Ethereum wallet <span class="logo-stack" role="img" aria-label="MetaMask, Rainbow and Rabby"><span><img src="/assets/metamask.svg" width="18" height="18" alt=""></span><span><img src="/assets/rainbow.svg" width="18" height="18" alt=""></span><span><img src="/assets/rabby.svg" width="18" height="18" alt=""></span></span></span>
        </p>
        <div class="coming-soon" aria-label="Upcoming protocols">
          <span class="privacy-pools-logo" aria-hidden="true"></span>
          <span>Privacy Pools v1 &amp; v2</span>
          <span class="status-badge">Coming soon</span>
        </div>
      </section>
      <section class="workspace" aria-label="Deposit">
      {{app.deposit}}
      <p class="trust" title="These contracts have not been independently audited.">Unaudited</p>
      </section>
    </main>
    <footer class="site-footer">
      <nav class="social-links" aria-label="Puddle links">
        <a href="{{brand.repository}}" target="_blank" rel="noreferrer" aria-label="Puddle on GitHub" title="GitHub"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
        <a href="https://x.com/staycloakedxyz" target="_blank" rel="noreferrer" aria-label="Cloaked on X" title="X"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.64 7.584H.47l8.6-9.835L0 1.154h7.594l5.243 6.932Zm-1.292 19.49h2.039L6.486 3.24H4.298Z"/></svg></a>
      </nav>
    </footer>
  </div>
  <div class="appearance theme-picker" role="group" aria-label="Appearance">
    <button data-theme-choice="light" type="button" aria-label="Light mode" aria-pressed="true" title="Light mode"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
    <button data-theme-choice="dark" type="button" aria-label="Dark mode" aria-pressed="false" title="Dark mode"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.9 13.1A8.7 8.7 0 0 1 10.9 3a9 9 0 1 0 10 10.1Z"/></svg></button>
  </div>
  <div class="toast" id="toast" role="status" hidden>Copied</div>
  <!-- build-version -->
</body>
</html>
