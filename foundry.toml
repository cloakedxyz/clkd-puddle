[profile.default]
src = "contracts"
test = "test/solidity"
out = ".cache/kernel-out"
cache_path = ".cache/kernel-build"
libs = []
auto_detect_remappings = false
remappings = [
  "kernel/=.cache/kernel/src/",
  "solady/=.cache/kernel/lib/solady/src/",
  "ExcessivelySafeCall/=.cache/kernel/lib/ExcessivelySafeCall/src/",
  "forge-std/=.cache/forge-std/src/",
]
solc = "0.8.32"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 2048

# Match the compiler/settings of the verified deployed Kernel v3.3 contracts.
# Puddle's module uses the newer compiler in the default profile above.
[profile.kernel]
src = ".cache/kernel/src"
test = ".cache/no-tests"
out = ".cache/stock-kernel-out"
cache_path = ".cache/stock-kernel-build"
solc = "0.8.28"

[fmt]
line_length = 120
